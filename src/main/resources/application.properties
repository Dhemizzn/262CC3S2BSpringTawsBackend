spring.application.name=261CC3S2BSpringSigconBackend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always
server.port=${PORT:8080}
jwt.secret=${TOKEN_JWT_SECRET}
logging.level.org.springframework.security=DEBUG
mercadopago.access-token=${MP_ACCESS_TOKEN}
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
apiinti.base-url=https://app.apiinti.dev/api/v1
apiinti.api-key=${APIINTI_API_KEY}
spring.jpa.properties.hibernate.default_schema=taws

app.version=1.0.0
app.description=Backend Peru TOURS
server.forward-headers-strategy=FRAMEWORK
management.endpoints.web.exposure.include=health,info,metrics,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Backend Peru TOURS
info.app.version=1.0.0
